<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#15161c">
<meta name="description" content="세트별로 모은 카드의 앞뒷면 사진과 센터링 측정값">
<title>카드 덱</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카드 덱">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="title">
    <h1>카드 덱</h1>
    <div id="decks" class="deck-switch" role="group" aria-label="덱 고르기"></div>
    <p id="summary" class="summary"></p>
    <a class="price-link" href="prices.html">박스 정가 보기</a>
  </div>
  <div class="side-toggle" role="group" aria-label="보이는 면">
    <button type="button" data-side="front" aria-pressed="true">앞면</button>
    <button type="button" data-side="back" aria-pressed="false">뒷면</button>
  </div>
</header>

<nav id="tabs" class="tabs" aria-label="세트"></nav>
<div id="grades" class="grades-filter"></div>

<main id="deck"></main>

<div id="viewer" class="viewer" hidden>
  <div class="viewer-backdrop" data-close></div>
  <div class="viewer-body" role="dialog" aria-modal="true" aria-labelledby="viewer-name">
    <button type="button" class="icon-btn close" data-close aria-label="닫기">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="stage">
      <button type="button" class="icon-btn nav prev" aria-label="이전 카드">
        <svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="flip" id="flip" role="button" tabindex="0" aria-label="카드 뒤집기" title="눌러서 뒤집기">
        <div class="flip-inner">
          <div class="face face-front"></div>
          <div class="face face-back"></div>
        </div>
      </div>
      <button type="button" class="icon-btn nav next" aria-label="다음 카드">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <aside class="viewer-info">
      <p class="viewer-set" id="viewer-set"></p>
      <h2 id="viewer-name"></h2>
      <button type="button" class="flip-btn" id="flip-btn">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg>
        <span>뒤집기</span>
      </button>
      <button type="button" class="share-btn" id="share-btn">
        <svg class="ico" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span>공유</span>
      </button>
      <section class="centering" id="centering" aria-label="센터링"></section>
      <section class="inspect" id="inspect" aria-label="상세 감정"></section>
    </aside>
  </div>
</div>

<div id="inspector" class="inspector" hidden role="dialog" aria-modal="true" aria-labelledby="insp-title">
  <header class="insp-bar">
    <button type="button" class="back-btn" id="insp-back">
      <svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      <span>카드로</span>
    </button>
    <div class="insp-title">
      <p class="viewer-set" id="insp-set"></p>
      <h2 id="insp-title"></h2>
    </div>
    <button type="button" class="mark-toggle" id="insp-toggle" aria-pressed="true">레드마크 표시</button>
  </header>
  <div class="insp-body" id="insp-body"></div>
  <p class="cnote insp-note">등급이 아니라 사진으로 찾은 흠 의심 자리예요. 빨간 번호는 흠 의심, 주황 점선은 조명 반사일 수 있는 곳이에요. 목록을 누르면 카드 위 표시가 깜빡여요. 루페로 한 번 더 확인해 주세요.</p>
</div>

<script src="cards.js"></script>
<script src="locks.js"></script>
<script src="share.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
