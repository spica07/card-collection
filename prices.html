<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#15161c">
<meta name="description" content="포켓몬 카드 한글판 박스별 공식 정가와 팩당 가격">
<title>박스 정가</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<style>
  .price-page { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
  .price-top { padding: 28px 0 12px; }
  .back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 12px; padding: 6px 0; }
  .back-link:hover { color: var(--ink); }
  .back-link .ico { width: 16px; height: 16px; }
  .price-top h1 { margin-top: 6px; }
  .price-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
  .price-sum button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 8px; text-align: left; }
  .price-sum button[aria-pressed="true"] { border-color: var(--accent); }
  .price-sum b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
  .price-sum span { color: var(--muted); font-size: 12px; }
  .sort { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .sort button { position: relative; border: 1px solid var(--line); background: var(--panel); padding: 6px 14px; border-radius: 999px; font-size: 15px; }
  .sort button::after { content: ""; position: absolute; inset: -6px 0; }
  .sort button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pack { color: var(--muted); white-space: nowrap; }
  .name { font-weight: 600; }
  .tier-70 { color: #ff8a8a; }
  .tier-50 { color: #7fb4ff; }
  .tier-45 { color: #6ed39a; }
  .tier-40 { color: #b7e07a; }
  .price-note { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .sub { display: none; }
  @media (max-width: 520px) {
    .price-sum { grid-template-columns: repeat(2, 1fr); }
    .col-pack { display: none; }
    .sub { display: block; color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 2px; }
    td, th { padding-left: 6px; padding-right: 6px; }
  }
</style>
</head>
<body>
<main class="price-page">
  <header class="price-top">
    <a class="back-link" href="./">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>카드 덱으로
    </a>
    <h1>박스 정가</h1>
    <p class="summary">포켓몬 카드 한글판 공식 정가 기준이에요. 팩당 가격은 정가를 팩 수로 나눈 값이에요.</p>
  </header>

  <div class="price-sum" id="tiers" role="group" aria-label="정가로 거르기"></div>
  <div class="sort" id="sort" role="group" aria-label="정렬">
    <button type="button" data-sort="order" aria-pressed="true">출시 최신순</button>
    <button type="button" data-sort="pack" aria-pressed="false">팩당 가격 높은순</button>
    <button type="button" data-sort="price" aria-pressed="false">정가 높은순</button>
  </div>

  <table>
    <thead>
      <tr><th>박스</th><th class="col-pack">구성</th><th class="num">정가</th><th class="num">팩당</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="price-note">정가는 공식 출시가예요. 매장이나 시기에 따라 실제 판매가는 다를 수 있어요.</p>
</main>

<script>
(function () {
  "use strict";
  // 위에서부터 최근 출시 순서 (한글판 공식 정가). [이름, 팩당 장수, 팩 수, 정가]
  const BOXES = [
    ["30th CELEBRATION", 6, 20, 70000],
    ["어비스아이", 5, 30, 45000],
    ["스톰에메랄다", 5, 30, 45000],
    ["닌자스피너", 5, 30, 30000],
    ["니힐제로", 5, 30, 30000],
    ["MEGA 드림 ex", 10, 10, 50000],
    ["인페르노X", 5, 30, 30000],
    ["메가심포니아", 5, 30, 30000],
    ["메가브레이브", 5, 30, 30000],
    ["블랙볼트", 7, 20, 40000],
    ["화이트플레어", 7, 20, 40000],
    ["로켓단의 영광", 5, 30, 30000],
    ["열풍의 아레나", 5, 30, 30000],
    ["배틀파트너즈", 5, 30, 30000],
    ["테라스탈 페스타 ex", 10, 10, 50000],
    ["초전브레이커", 5, 30, 30000],
    ["낙원드래고나", 5, 30, 30000],
    ["스텔라미라클", 5, 30, 30000],
    ["나이트원더러", 5, 30, 30000],
    ["변환의 가면", 5, 30, 30000],
    ["크림슨헤이즈", 5, 30, 30000],
    ["사이버저지", 5, 30, 30000],
    ["와일드포스", 5, 30, 30000],
    ["샤이니트레저 ex", 10, 10, 50000],
    ["고대의 포효", 5, 30, 30000],
    ["미래의 일섬", 5, 30, 30000],
    ["레이징서프", 5, 30, 30000],
    ["흑염의 지배자", 5, 30, 30000],
    ["포켓몬 카드 151", 7, 20, 50000],
    ["스노해저드", 5, 30, 30000],
    ["클레이버스트", 5, 30, 30000],
    ["트리플렛비트", 5, 30, 30000],
    ["스칼렛 ex", 5, 30, 30000],
    ["바이올렛 ex", 5, 30, 30000],
    ["VSTAR 유니버스", 10, 10, 50000]
  ].map(([name, cards, packs, price], i) => ({ name, cards, packs, price, order: i, perPack: Math.round(price / packs) }));

  const won = (n) => n.toLocaleString("ko-KR") + "원";
  const tierClass = (p) => ({ 70000: "tier-70", 50000: "tier-50", 45000: "tier-45", 40000: "tier-40" })[p] || "";
  let sortBy = "order";
  let tier = null; // null = 전체

  const tiersEl = document.getElementById("tiers");
  const rowsEl = document.getElementById("rows");

  function renderTiers() {
    const counts = new Map();
    BOXES.forEach((b) => counts.set(b.price, (counts.get(b.price) || 0) + 1));
    const prices = [...counts.keys()].sort((a, b) => b - a);
    tiersEl.replaceChildren();
    const make = (label, n, value) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-pressed", String(tier === value));
      const b = document.createElement("b"); b.textContent = label;
      if (value) b.className = tierClass(value);
      const s = document.createElement("span"); s.textContent = n + "종";
      btn.append(b, s);
      btn.addEventListener("click", () => { tier = tier === value ? null : value; render(); });
      tiersEl.append(btn);
    };
    make("전체", BOXES.length, null);
    prices.forEach((p) => make(won(p), counts.get(p), p));
  }

  function render() {
    renderTiers();
    document.querySelectorAll("#sort button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sort === sortBy)));
    const list = BOXES.filter((b) => tier === null || b.price === tier).slice();
    if (sortBy === "pack") list.sort((a, b) => b.perPack - a.perPack || a.order - b.order);
    if (sortBy === "price") list.sort((a, b) => b.price - a.price || a.order - b.order);
    rowsEl.replaceChildren(...list.map((b) => {
      const tr = document.createElement("tr");
      const comp = `${b.cards}장 × ${b.packs}팩`;
      tr.innerHTML = '<td class="name"></td><td class="pack col-pack"></td><td class="num"></td><td class="num pack"></td>';
      const [n, c, p, pp] = tr.children;
      n.textContent = b.name;
      const sub = document.createElement("span"); sub.className = "sub"; sub.textContent = comp;
      n.append(sub);
      c.textContent = comp;
      p.textContent = won(b.price); p.classList.add("name");
      if (tierClass(b.price)) p.classList.add(tierClass(b.price));
      pp.textContent = won(b.perPack);
      return tr;
    }));
  }

  document.getElementById("sort").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-sort]");
    if (b) { sortBy = b.dataset.sort; render(); }
  });
  render();
})();
</script>
</body>
</html>
